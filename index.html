
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity Type</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .cursor-blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #38bdf8 }
        }
        @keyframes selection-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1.05); }
        }
        .animate-selection {
            animation: selection-pop 0.3s ease-out forwards;
        }
        
        /* Racing specific animations */
        @keyframes engine-rumble {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50% { transform: translateY(-1px) rotate(-1.5deg); }
        }
        .engine-rumble {
            animation: engine-rumble 0.1s ease-in-out infinite;
        }
        
        @keyframes smoke-puff {
            0% { transform: scale(0.2) translate(0, 0); opacity: 0.8; }
            100% { transform: scale(2) translate(-40px, -10px); opacity: 0; }
        }
        .smoke {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(200, 200, 200, 0.4);
            border-radius: 50%;
            pointer-events: none;
            animation: smoke-puff 0.8s ease-out infinite;
        }
        
        @keyframes nitro-flare {
            0%, 100% { opacity: 0.3; transform: scaleX(1); }
            50% { opacity: 0.8; transform: scaleX(1.5); }
        }
        .nitro {
            animation: nitro-flare 0.2s ease-in-out infinite;
        }
    </style>

</html>
